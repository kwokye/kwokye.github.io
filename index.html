<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Academic Homepage</title>
  <meta name="description" content="Personal academic homepage.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              600: '#0284c7',
              700: '#0369a1',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Prevent Theme Flashing on Load -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <style>
    /* Native Clean Expandable BibTeX */
    details > summary {
      cursor: pointer;
      list-style: none;
    }
    details > summary::-webkit-details-marker {
      display: none;
    }
  </style>

  <!-- 引入填空式数据配置文件 (在此文件修改文字即可) -->
  <script src="profile_data.js"></script>
</head>

<body class="bg-white dark:bg-zinc-950 text-zinc-800 dark:text-zinc-200 antialiased font-sans min-h-screen transition-colors duration-200 selection:bg-sky-500 selection:text-white">

  <!-- ====================================================================
       TOP NAVIGATION BAR
       ==================================================================== -->
  <header class="sticky top-0 z-50 bg-white/90 dark:bg-zinc-950/90 backdrop-blur-md border-b border-zinc-100 dark:border-zinc-800/80">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <a href="#" id="nav-brand" class="font-bold text-base tracking-tight text-zinc-900 dark:text-zinc-100 hover:text-sky-600 dark:hover:text-sky-400 transition-colors">
        <!-- Filled by JS -->
      </a>

      <div class="flex items-center gap-4 sm:gap-6 text-sm">
        <nav class="hidden sm:flex items-center gap-5 text-zinc-600 dark:text-zinc-400 font-medium">
          <a href="#about" class="hover:text-sky-600 dark:hover:text-sky-400 transition-colors">About</a>
          <a href="#news" class="hover:text-sky-600 dark:hover:text-sky-400 transition-colors">News</a>
          <a href="#publications" class="hover:text-sky-600 dark:hover:text-sky-400 transition-colors">Publications</a>
          <a href="#education" class="hover:text-sky-600 dark:hover:text-sky-400 transition-colors">Education</a>
          <a href="#services" class="hover:text-sky-600 dark:hover:text-sky-400 transition-colors">Services</a>
        </nav>

        <!-- Dark/Light Theme Toggle Button -->
        <button id="theme-toggle" class="p-1.5 rounded-lg text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" aria-label="Toggle Theme">
          <!-- Sun Icon -->
          <svg id="sun-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <!-- Moon Icon -->
          <svg id="moon-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ====================================================================
       MAIN CONTENT CONTAINER
       ==================================================================== -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 sm:py-12 space-y-12 sm:space-y-16">

    <!-- 1. PROFILE & ABOUT ME -->
    <section id="about" class="pt-2">
      <div class="flex flex-col-reverse sm:flex-row items-center sm:items-start justify-between gap-8">
        
        <!-- Text Bio & Links -->
        <div class="flex-1 space-y-3.5 text-center sm:text-left">
          <div id="profile-header"></div>
          <div id="profile-links" class="flex flex-wrap items-center justify-center sm:justify-start gap-2 pt-1"></div>
          <div id="profile-bio" class="pt-2 text-sm text-zinc-600 dark:text-zinc-300 space-y-2.5 leading-relaxed"></div>
          <div id="profile-interests" class="pt-1.5"></div>
        </div>

        <!-- Profile Photo / Avatar -->
        <div class="flex-shrink-0" id="profile-avatar-container"></div>

      </div>
    </section>

    <!-- 2. NEWS & UPDATES -->
    <section id="news" class="space-y-4 pt-4 border-t border-zinc-100 dark:border-zinc-800/80">
      <h2 class="text-xl font-bold tracking-tight text-zinc-900 dark:text-white flex items-center gap-2">
        <span>📢</span> News & Updates
      </h2>
      <ul id="news-list" class="space-y-2.5 text-sm text-zinc-600 dark:text-zinc-300"></ul>
    </section>

    <!-- 3. SELECTED PUBLICATIONS -->
    <section id="publications" class="space-y-6 pt-4 border-t border-zinc-100 dark:border-zinc-800/80">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold tracking-tight text-zinc-900 dark:text-white flex items-center gap-2">
          <span>📚</span> Selected Publications
        </h2>
        <a id="scholar-more-link" href="#" target="_blank" rel="noopener noreferrer" class="text-xs font-medium text-sky-600 dark:text-sky-400 hover:underline">
          View full list on Google Scholar &rarr;
        </a>
      </div>
      <div id="publications-list" class="space-y-5"></div>
    </section>

    <!-- 4. EDUCATION & EXPERIENCE -->
    <section id="education" class="space-y-6 pt-4 border-t border-zinc-100 dark:border-zinc-800/80">
      <h2 class="text-xl font-bold tracking-tight text-zinc-900 dark:text-white flex items-center gap-2">
        <span>🎓</span> Education & Experience
      </h2>
      <div id="education-list" class="space-y-6 text-sm"></div>
    </section>

    <!-- 5. ACADEMIC SERVICES & HONORS -->
    <section id="services" class="space-y-4 pt-4 border-t border-zinc-100 dark:border-zinc-800/80">
      <h2 class="text-xl font-bold tracking-tight text-zinc-900 dark:text-white flex items-center gap-2">
        <span>🏆</span> Services & Honors
      </h2>
      <div id="services-container" class="grid grid-cols-1 sm:grid-cols-2 gap-6 text-sm"></div>
    </section>

  </main>

  <!-- ====================================================================
       FOOTER
       ==================================================================== -->
  <footer class="border-t border-zinc-100 dark:border-zinc-800/80 mt-16 py-8 text-center text-xs text-zinc-400 dark:text-zinc-500">
    <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
      <p id="footer-text">© 2026 Lin Guo. Hosted on GitHub Pages.</p>
      <p>Clean & Minimal Academic Theme.</p>
    </div>
  </footer>

  <!-- ====================================================================
       AUTO-RENDER TEMPLATE LOGIC
       ==================================================================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof PROFILE_DATA === 'undefined') {
        console.error('profile_data.js 未找到或未加载');
        return;
      }
      const data = PROFILE_DATA;

      // 1. 网页标题与导航品牌
      document.title = `${data.name} (${data.chineseName}) | Academic Homepage`;
      document.getElementById('nav-brand').innerHTML = `
        ${data.name} <span class="font-normal text-zinc-500 dark:text-zinc-400 font-serif text-sm">${data.chineseName}</span>
      `;
      document.getElementById('footer-text').innerHTML = `© 2026 ${data.name} (${data.chineseName}). Hosted on GitHub Pages.`;

      // 2. Profile 区域
      document.getElementById('profile-header').innerHTML = `
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-zinc-900 dark:text-white">
          ${data.name} <span class="text-xl sm:text-2xl font-normal text-zinc-500 dark:text-zinc-400 font-serif">（${data.chineseName}）</span>
        </h1>
        <p class="text-base text-zinc-700 dark:text-zinc-300 font-medium mt-1">
          ${data.title}
        </p>
        <p class="text-sm text-zinc-500 dark:text-zinc-400">
          <a href="${data.affiliationUrl}" target="_blank" rel="noopener noreferrer" class="text-sky-600 dark:text-sky-400 hover:underline font-medium">${data.affiliation}</a>
        </p>
      `;

      // 社交/学术链接
      const links = data.links || {};
      const linksHtml = [];
      if (links.googleScholar) {
        linksHtml.push(`
          <a href="${links.googleScholar}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-medium rounded-md bg-zinc-100 dark:bg-zinc-800/80 text-zinc-700 dark:text-zinc-300 hover:bg-sky-50 dark:hover:bg-sky-950/40 hover:text-sky-600 dark:hover:text-sky-400 transition-colors shadow-sm">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 24a7 7 0 1 1 0-14 7 7 0 0 1 0 14zm0-24L0 9.5l4.838 3.94A8 8 0 0 1 12 9a8 8 0 0 1 7.162 4.44L24 9.5z"/></svg>
            Google Scholar
          </a>
        `);
        const scholarMore = document.getElementById('scholar-more-link');
        if (scholarMore) scholarMore.href = links.googleScholar;
      }
      if (links.linkedIn) {
        linksHtml.push(`
          <a href="${links.linkedIn}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-medium rounded-md bg-zinc-100 dark:bg-zinc-800/80 text-zinc-700 dark:text-zinc-300 hover:bg-sky-50 dark:hover:bg-sky-950/40 hover:text-sky-600 dark:hover:text-sky-400 transition-colors shadow-sm">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
            LinkedIn
          </a>
        `);
      }
      if (links.email) {
        linksHtml.push(`
          <a href="${links.email}" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-medium rounded-md bg-zinc-100 dark:bg-zinc-800/80 text-zinc-700 dark:text-zinc-300 hover:bg-sky-50 dark:hover:bg-sky-950/40 hover:text-sky-600 dark:hover:text-sky-400 transition-colors shadow-sm">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            Email
          </a>
        `);
      }
      if (links.gitHub) {
        linksHtml.push(`
          <a href="${links.gitHub}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-medium rounded-md bg-zinc-100 dark:bg-zinc-800/80 text-zinc-700 dark:text-zinc-300 hover:bg-sky-50 dark:hover:bg-sky-950/40 hover:text-sky-600 dark:hover:text-sky-400 transition-colors shadow-sm">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
            GitHub
          </a>
        `);
      }
      if (links.cv && links.cv !== '#') {
        linksHtml.push(`
          <a href="${links.cv}" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-medium rounded-md bg-zinc-100 dark:bg-zinc-800/80 text-zinc-700 dark:text-zinc-300 hover:bg-sky-50 dark:hover:bg-sky-950/40 hover:text-sky-600 dark:hover:text-sky-400 transition-colors shadow-sm">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            CV (PDF)
          </a>
        `);
      }
      document.getElementById('profile-links').innerHTML = linksHtml.join('');

      // Bio 段落
      document.getElementById('profile-bio').innerHTML = (data.bio || []).map(p => `<p>${p}</p>`).join('');

      // 研究兴趣
      if (data.researchInterests && data.researchInterests.length > 0) {
        document.getElementById('profile-interests').innerHTML = `
          <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400 dark:text-zinc-500 block mb-2">Research Interests:</span>
          <div class="flex flex-wrap gap-1.5">
            ${data.researchInterests.map(item => `
              <span class="px-2.5 py-1 text-xs rounded-md bg-sky-50 dark:bg-sky-950/50 text-sky-700 dark:text-sky-300 font-medium">${item}</span>
            `).join('')}
          </div>
        `;
      }

      // 头像
      const avatarContainer = document.getElementById('profile-avatar-container');
      if (data.avatar && data.avatar.trim() !== '') {
        avatarContainer.innerHTML = `
          <div class="w-36 h-36 sm:w-44 sm:h-44 rounded-2xl overflow-hidden bg-zinc-100 dark:bg-zinc-800 border-2 border-zinc-200 dark:border-zinc-700 shadow-sm">
            <img src="${data.avatar}" alt="${data.name}" class="w-full h-full object-cover">
          </div>
        `;
      } else {
        avatarContainer.innerHTML = `
          <div class="w-36 h-36 sm:w-44 sm:h-44 rounded-2xl overflow-hidden bg-zinc-100 dark:bg-zinc-800 border-2 border-zinc-200 dark:border-zinc-700 shadow-sm flex items-center justify-center">
            <svg class="w-20 h-20 text-zinc-400 dark:text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>
        `;
      }

      // 3. News 列表
      document.getElementById('news-list').innerHTML = (data.news || []).map(item => `
        <li class="flex items-start gap-3">
          <span class="text-xs font-mono font-semibold text-zinc-400 dark:text-zinc-500 whitespace-nowrap pt-0.5">${item.date}</span>
          <span>${item.content}</span>
        </li>
      `).join('');

      // 4. Publications 列表
      document.getElementById('publications-list').innerHTML = (data.publications || []).map(pub => {
        const linksList = (pub.links || []).map(l => `
          <a href="${l.url}" target="_blank" rel="noopener noreferrer" class="px-2 py-0.5 rounded border border-zinc-300 dark:border-zinc-700 text-zinc-700 dark:text-zinc-300 hover:border-sky-500 hover:text-sky-600 dark:hover:text-sky-400 transition-colors">
            ${l.label}
          </a>
        `).join('');

        const bibtexBlock = pub.bibtex && pub.bibtex.trim() !== '' ? `
          <details class="inline-block">
            <summary class="px-2 py-0.5 rounded border border-zinc-300 dark:border-zinc-700 text-zinc-700 dark:text-zinc-300 hover:border-sky-500 hover:text-sky-600 dark:hover:text-sky-400 transition-colors">
              [BibTeX]
            </summary>
            <pre class="mt-2 p-3 bg-zinc-100 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200 rounded-lg text-[11px] font-mono overflow-x-auto select-all">${pub.bibtex}</pre>
          </details>
        ` : '';

        return `
          <article class="space-y-1.5 p-4 rounded-xl hover:bg-zinc-50 dark:hover:bg-zinc-900/60 transition-colors border border-transparent hover:border-zinc-200 dark:hover:border-zinc-800">
            <h3 class="text-base font-bold text-zinc-900 dark:text-zinc-100 leading-snug">
              ${pub.title}
            </h3>
            <p class="text-sm text-zinc-600 dark:text-zinc-300">
              ${pub.authors}
            </p>
            <p class="text-xs text-zinc-500 dark:text-zinc-400 font-medium">
              <span class="text-sky-600 dark:text-sky-400 font-semibold">${pub.venue}</span> ${pub.venueDetail ? '• ' + pub.venueDetail : ''}
            </p>
            <div class="flex flex-wrap items-center gap-2 pt-1 text-xs">
              ${linksList}
              ${bibtexBlock}
            </div>
          </article>
        `;
      }).join('');

      // 5. Education 列表
      document.getElementById('education-list').innerHTML = (data.education || []).map(edu => `
        <div class="flex items-start gap-4">
          <div class="w-10 h-10 rounded-xl ${edu.badgeColor || 'bg-sky-800 text-white'} font-bold flex items-center justify-center text-xs flex-shrink-0 shadow-sm">
            ${edu.logoBadge || 'EDU'}
          </div>
          <div class="flex-1 flex flex-col sm:flex-row sm:items-baseline justify-between gap-1">
            <div>
              <h4 class="font-bold text-zinc-900 dark:text-white text-base">${edu.institution}</h4>
              <p class="text-zinc-700 dark:text-zinc-300 text-sm font-medium">${edu.degree}</p>
              ${edu.subDetail ? `<p class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5">${edu.subDetail}</p>` : ''}
            </div>
            <span class="text-xs font-mono text-zinc-400 dark:text-zinc-500 whitespace-nowrap">${edu.period}</span>
          </div>
        </div>
      `).join('');

      // 6. Services & Honors
      const serv = data.services || {};
      document.getElementById('services-container').innerHTML = `
        <div class="space-y-2">
          <h4 class="font-semibold text-zinc-900 dark:text-white text-xs uppercase tracking-wider text-zinc-400">Academic Reviewer</h4>
          <ul class="list-disc list-inside text-zinc-600 dark:text-zinc-300 text-xs sm:text-sm space-y-1.5">
            ${(serv.reviewers || []).map(r => `<li>${r}</li>`).join('')}
          </ul>
        </div>
        <div class="space-y-2">
          <h4 class="font-semibold text-zinc-900 dark:text-white text-xs uppercase tracking-wider text-zinc-400">Selected Honors & Awards</h4>
          <ul class="list-disc list-inside text-zinc-600 dark:text-zinc-300 text-xs sm:text-sm space-y-1.5">
            ${(serv.awards || []).map(a => `<li>${a}</li>`).join('')}
          </ul>
        </div>
      `;
    });
  </script>

  <!-- Theme Switcher Script (Lightweight Vanilla JS) -->
  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('sun-icon');
    const moonIcon = document.getElementById('moon-icon');

    function updateIcons(isDark) {
      if (isDark) {
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      } else {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      }
    }

    updateIcons(document.documentElement.classList.contains('dark'));

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateIcons(isDark);
    });
  </script>
</body>
</html>
